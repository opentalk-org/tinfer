name: Rust CPU checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Test the CPU backend
        run: nix develop --command cargo test --manifest-path tinfer_rust/Cargo.toml --features onnx
