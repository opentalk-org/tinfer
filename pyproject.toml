[project]
name = "tinfer-conversion-tools"
version = "0.1.0"
description = "Model export tooling for the Rust Tinfer server"
requires-python = ">=3.11"
dependencies = ["tinfer-model-conversion"]

[dependency-groups]
dev = ["pytest>=8"]
examples = ["grpcio-tools>=1.76", "websockets>=15"]

[tool.uv.workspace]
members = ["tools/model_conversion"]

[tool.uv.sources]
tinfer-model-conversion = { workspace = true }

[tool.uv]
package = false
