[project]
name = "tinfer-model-conversion"
version = "0.1.0"
description = "StyleTTS2 model definitions for exporting Tinfer Rust artifacts"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "librosa>=0.11.0",
    "munch>=4.0.0",
    "numpy>=2.4.2",
    "onnx>=1.22.0",
    "pyyaml>=6.0",
    "soundfile>=0.13",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=5.2.0",
]

[project.optional-dependencies]
tensorrt = ["tensorrt-cu12"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinfer*"]
